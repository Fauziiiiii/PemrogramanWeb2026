<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SIMPUS-Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <!-- Register Card -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold mb-2">Buat Akun</h1>
                            <p class="text-muted mb-0">
                                Daftar untuk menggunakan SIMPUS-Mini
                            </p>
                        </div>

                        <!-- Register Form -->
                        <form action="#" method="post">

                            <!-- Nama Lengkap -->
                            <div class="mb-3">
                                <label for="nama" class="form-label">
                                    Nama Lengkap
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nama"
                                    name="nama"
                                    placeholder="Masukkan nama lengkap"
                                    required
                                >
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Masukkan email"
                                    required
                                >
                            </div>

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    placeholder="Masukkan username"
                                    required
                                >
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Masukkan password"
                                    minlength="8"
                                    required
                                >
                                <div class="form-text">
                                    Password minimal 8 karakter.
                                </div>
                            </div>

                            <!-- Konfirmasi Password -->
                            <div class="mb-4">
                                <label for="password_confirmation" class="form-label">
                                    Konfirmasi Password
                                </label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password_confirmation"
                                    name="password_confirmation"
                                    placeholder="Masukkan ulang password"
                                    minlength="8"
                                    required
                                >
                            </div>

                            <!-- Terms -->
                            <div class="form-check mb-4">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    name="terms"
                                    required
                                >
                                <label class="form-check-label" for="terms">
                                    Saya menyetujui syarat dan ketentuan yang berlaku.
                                </label>
                            </div>

                            <!-- Register Button -->
                            <div class="d-grid">
                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Daftar
                                </button>
                            </div>

                        </form>

                        <!-- Login Link -->
                        <div class="text-center mt-4">
                            <p class="mb-0 text-muted">
                                Sudah memiliki akun?
                                <a href="login.html" class="text-decoration-none fw-semibold">
                                    Login
                                </a>
                            </p>
                        </div>

                    </div>
                </div>

                <!-- Back to Home -->
                <div class="text-center mt-3">
                    <a href="../index.html" class="text-decoration-none text-muted">
                        ← Kembali ke halaman utama
                    </a>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
