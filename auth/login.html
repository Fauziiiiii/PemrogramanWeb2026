<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMPUS-Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                <!-- Login Card -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold mb-2">SIMPUS-Mini</h1>
                            <p class="text-muted mb-0">
                                Silakan masuk ke akun Anda
                            </p>
                        </div>

                        <!-- Login Form -->
                        <form>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Masukkan email"
                                    required
                                >
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Masukkan password"
                                    required
                                >
                            </div>

                            <!-- Remember Me -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check gap-2">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="remember"
                                        name="remember"
                                    >
                                    <label class="form-check-label" for="remember">
                                        Ingat saya
                                    </label>
                                </div>

                                <a href="#" class="text-decoration-none">
                                    Lupa password?
                                </a>
                            </div>

                            <!-- Login Button -->
                            <div class="d-grid">
                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Login
                                </button>
                            </div>

                        </form>

                        <!-- Register Link -->
                        <div class="text-center mt-4">
                            <p class="mb-0 text-muted">
                                Belum memiliki akun?
                                <a href="register.html" class="text-decoration-none fw-semibold">
                                    Daftar sekarang
                                </a>
                            </p>
                        </div>

                    </div>
                </div>

                <!-- Back to Home -->
                <div class="text-center mt-3">
                    <a href="../index.html" class="text-decoration-none text-muted">
                        ← Kembali ke halaman utama
                    </a>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
