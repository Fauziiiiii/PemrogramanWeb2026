<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMPUS-Mini</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">

            <h1>SIMPUS-Mini</h1>
            <p class="auth-subtitle">Silakan masuk ke akun Anda</p>

            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>


                <div class="form-row-between">
                    <div class="checkbox-row">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Ingat saya</label>
                    </div>
                    <a href="#">Lupa password?</a>
                </div>


                <div class="form-group">
                    <button type="submit" class="btn-block">Login</button>
                </div>
            </form>

            <p class="auth-footer">
                Belum memiliki akun?
                <a href="register.html">Daftar sekarang</a>
            </p>
        </div>
        <p class="auth-back">
            <a href="../index.html">&larr; Kembali ke halaman utama</a>
        </p>
    </div>
</body>
</html>
