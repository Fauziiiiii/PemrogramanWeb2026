<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#0f4c5c;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../auth/login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title mb-4 fw-bold" style="color:#0f4c5c;">Tambah Buku</h2>

                <div id="liveAlertPlaceholder"></div>

                <form id="formTambahBuku">
                    <div class="mb-3">
                        <label for="judul" class="form-label fw-medium">Judul Buku</label>
                        <input type="text" class="form-control" id="judul" name="judul" placeholder="Masukkan judul buku" required>
                    </div>
                    <div class="mb-3">
                        <label for="pengarang" class="form-label fw-medium">Pengarang</label>
                        <input type="text" class="form-control" id="pengarang" name="pengarang" placeholder="Masukkan nama pengarang" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tahun" class="form-label fw-medium">Tahun Terbit</label>
                            <input type="number" class="form-control" id="tahun" name="tahun" min="1900" max="2026" placeholder="Contoh: 2024" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="isbn" class="form-label fw-medium">ISBN</label>
                            <input type="text" class="form-control" id="isbn" name="isbn" placeholder="Contoh: 978-xxx-xxx">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stok" class="form-label fw-medium">Stok</label>
                            <input type="number" class="form-control" id="stok" name="stok" min="0" placeholder="Jumlah stok" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="kategori" class="form-label fw-medium">Kategori</label>
                            <select class="form-select" id="kategori" name="kategori">
                                <option value="fiksi">Fiksi</option>
                                <option value="non-fiksi">Non-Fiksi</option>
                                <option value="referensi">Referensi</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn text-white px-4" style="background-color:#0f4c5c;">Simpan</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const alertPlaceholder = document.getElementById('liveAlertPlaceholder');
        const formTambahBuku = document.getElementById('formTambahBuku');

        const appendAlert = (message, type) => {
            alertPlaceholder.innerHTML = '';
            
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible fade show" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('');

            alertPlaceholder.append(wrapper);
        }

        if (formTambahBuku) {
            formTambahBuku.addEventListener('submit', (event) => {
                event.preventDefault(); 
                
                appendAlert('Sukses! Data buku baru berhasil disimpan.', 'success');
                
                formTambahBuku.reset();
            });
        }
    </script>
</body>
</html>
