<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#0f4c5c;">
        <div class="container">
            <!-- Perbaikan link href ke index beranda -->
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../auth/login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title mb-4 fw-bold" style="color:#0f4c5c;">Tambah Anggota</h2>
                
                <!-- Tempat Alert Muncul -->
                <div id="liveAlertPlaceholder"></div>

                <!-- Form diberi ID untuk Javascript -->
                <form id="formTambahAnggota">
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-medium">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="no_anggota" class="form-label fw-medium">No. Anggota</label>
                            <input type="text" class="form-control" id="no_anggota" name="no_anggota" placeholder="Contoh: A001" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="no_hp" class="form-label fw-medium">No. HP</label>
                            <input type="text" class="form-control" id="no_hp" name="no_hp" placeholder="Contoh: 08123456789">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="alamat" class="form-label fw-medium">Alamat</label>
                        <!-- Diubah menjadi textarea agar lebih nyaman diisi alamat panjang -->
                        <textarea class="form-control" id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat domisili lengkap"></textarea>
                    </div>
                    
                    <div class="mt-3">
                        <button type="submit" class="btn text-white px-4" style="background-color:#0f4c5c;">Simpan</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const alertPlaceholder = document.getElementById('liveAlertPlaceholder');
        const formTambahAnggota = document.getElementById('formTambahAnggota');

        const appendAlert = (message, type) => {
            alertPlaceholder.innerHTML = '';
            
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible fade show" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('');

            alertPlaceholder.append(wrapper);
        }

        if (formTambahAnggota) {
            formTambahAnggota.addEventListener('submit', (event) => {
                event.preventDefault(); 
                
                appendAlert('Sukses! Data anggota baru berhasil disimpan.', 'success');
                
                formTambahAnggota.reset();
            });
        }
    </script>
</body>
</html>
